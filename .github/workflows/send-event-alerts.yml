name: Send Event Alerts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without sending broadcasts
        required: false
        default: 'false'
  schedule:
    - cron: '17 * * * *'

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Try deployed alert sender
        id: deployed-sender
        continue-on-error: true
        env:
          EVENT_ALERTS_API_BASE_URL: ${{ secrets.EVENT_ALERTS_API_BASE_URL }}
          EVENT_ALERTS_BASE_URL: ${{ secrets.EVENT_ALERTS_BASE_URL }}
          EVENT_ALERTS_CRON_SECRET: ${{ secrets.EVENT_ALERTS_CRON_SECRET }}
        run: |
          SENDER_BASE_URL="${EVENT_ALERTS_API_BASE_URL:-$EVENT_ALERTS_BASE_URL}"

          if [ -z "$SENDER_BASE_URL" ]; then
            echo "No EVENT_ALERTS_API_BASE_URL or EVENT_ALERTS_BASE_URL configured for deployed sender."
            exit 1
          fi

          ENDPOINT="${SENDER_BASE_URL%/}/api/send-event-alerts"
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            ENDPOINT="$ENDPOINT?dry_run=true"
          fi

          if [ -n "$EVENT_ALERTS_CRON_SECRET" ]; then
            curl --fail-with-body --show-error --silent -X POST -H "Authorization: Bearer $EVENT_ALERTS_CRON_SECRET" "$ENDPOINT"
          else
            curl --fail-with-body --show-error --silent -X POST "$ENDPOINT"
          fi

      - name: Validate fallback sender configuration
        if: steps.deployed-sender.outcome != 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EVENT_ALERTS_BASE_URL: ${{ secrets.EVENT_ALERTS_BASE_URL }}
        run: |
          missing=0

          for name in RESEND_API_KEY EVENT_ALERTS_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the fallback sender."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Send event alerts
        if: steps.deployed-sender.outcome != 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          EVENT_ALERTS_API_BASE_URL: ${{ secrets.EVENT_ALERTS_API_BASE_URL }}
          EVENT_ALERTS_BASE_URL: ${{ secrets.EVENT_ALERTS_BASE_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          echo "Deployed sender unavailable, falling back to the Node sender."
          npx tsx scripts/send-new-event-alerts.ts $EXTRA_ARGS